<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Versus Electoral — candidaturas, propuestas y noticias de Lima">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="58%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="#0d1117" opacity=".32"/>

  <circle cx="880" cy="110" r="150" fill="#2563eb" opacity=".08" filter="url(#glow)"/>
  <path d="M620 36 L1000 -24 L1000 304 L620 242 Z" fill="url(#accent)" opacity=".045"/>

  <!-- Cards de comparación -->
  <g transform="translate(690 48)">
    <rect width="112" height="176" rx="12" fill="#172131" stroke="#334155"/>
    <circle cx="56" cy="55" r="27" fill="#243b53" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="56" cy="49" r="9" fill="#bae6fd" opacity=".9"/>
    <path d="M38 76 Q56 58 74 76 Q74 88 38 88Z" fill="#bae6fd" opacity=".9"/>
    <text x="56" y="112" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">CANDIDATURA A</text>
    <rect x="20" y="132" width="72" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="132" width="53" height="6" rx="3" fill="url(#cyan)"/>
    <rect x="20" y="148" width="72" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="148" width="38" height="6" rx="3" fill="#67e8f9" opacity=".7"/>
  </g>

  <g transform="translate(858 48)">
    <rect width="112" height="176" rx="12" fill="#241d27" stroke="#57323b"/>
    <circle cx="56" cy="55" r="27" fill="#4a2027" stroke="#f87171" stroke-width="2"/>
    <circle cx="56" cy="49" r="9" fill="#fecaca" opacity=".9"/>
    <path d="M38 76 Q56 58 74 76 Q74 88 38 88Z" fill="#fecaca" opacity=".9"/>
    <text x="56" y="112" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#d6a4a0">CANDIDATURA B</text>
    <rect x="20" y="132" width="72" height="6" rx="3" fill="#57323b"/>
    <rect x="20" y="132" width="42" height="6" rx="3" fill="url(#accent)"/>
    <rect x="20" y="148" width="72" height="6" rx="3" fill="#57323b"/>
    <rect x="20" y="148" width="59" height="6" rx="3" fill="#f87171" opacity=".8"/>
  </g>

  <circle cx="830" cy="124" r="29" fill="#0d1117" stroke="url(#accent)" stroke-width="3"/>
  <text x="830" y="132" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc">VS</text>
  <text x="830" y="250" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">LIMA 2026 · DATOS PÚBLICOS</text>

  <!-- Marca -->
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1">Versus</text>
  <text x="64" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-style="italic" font-weight="700" fill="url(#accent)" letter-spacing="-1">electoral</text>
  <rect x="66" y="206" width="46" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">candidaturas · propuestas · noticias</text>
</svg>
