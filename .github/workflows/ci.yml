name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # No bloqueante: el repo arrastra 4 errores de react-hooks en los
      # componentes 3D, previos a este workflow. Se ven en el log, pero no
      # deberían frenar PRs que no los tocan.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Corre sobre el código fuente, sin build ni base de datos: atrapa un
      # revalidate corto antes de que llegue a producción y queme la cuota.
      - name: ISR budget
        run: npm run check:isr
